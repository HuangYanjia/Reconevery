name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --all-groups --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Run CPU-only mock demo
        run: >-
          uv run recon2sim run
          --input examples/tabletop
          --config configs/mock.yaml
          --run-dir runs/tabletop_demo

      - name: Validate generated Scene IR
        run: uv run recon2sim validate-ir runs/tabletop_demo/scene_ir/scene.json

      - name: Upload mock run after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tabletop-demo-failure
          path: runs/tabletop_demo
          if-no-files-found: ignore
