[project]
name = "reconevery-genrecon-worker"
version = "0.1.1"
description = "Isolated official GenRecon worker for Reconevery"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "trimesh>=4.6,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genrecon_worker"]
