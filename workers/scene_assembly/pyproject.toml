[project]
name = "reconevery-scene-assembly-worker"
version = "0.1.0"
description = "Isolated visual-only Phase 6B scene assembly preview worker"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<12",
  "pydantic>=2.10,<3",
  "trimesh>=4.6,<5",
]

[project.scripts]
scene-assembly-worker = "scene_assembly_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scene_assembly_worker"]
