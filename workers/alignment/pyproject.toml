[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconevery-alignment-worker"
version = "0.1.0"
description = "Isolated camera-mesh transform audit and bounded global Sim(3) refinement"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.10,<6",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "trimesh>=4.8,<5",
]

[project.scripts]
alignment-worker = "alignment_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alignment_worker*"]
