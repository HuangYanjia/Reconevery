[project]
name = "reconevery-world-calibration-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
]

[project.scripts]
reconevery-world-calibration = "world_calibration_worker.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["world_calibration_worker"]
