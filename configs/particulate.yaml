seed: 42
stages:
  particulate_candidates:
    adapter:
      name: particulate_candidates
      env: [PATH, HOME, TMPDIR, HF_HOME, HF_HUB_OFFLINE]
      timeout_s: 1800
      required_gpu_memory_gb: 16
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/particulate-env/bin/python
        worker_module: particulate_worker
        docker_image: reconevery/particulate:phase5c
        official_repository: https://github.com/RuiningLi/particulate
        official_code_commit: dee37a75c449f324d9989993461ee09eaccc1686
        checkpoint_repository: rayli/Particulate
        checkpoint_revision: 096167e661feb92a443535d15916323ec8a01613
        official_repository_path: /absolute/path/to/official/particulate
        checkpoint_path: /absolute/path/to/model.pt
        partfield_checkpoint_path: /absolute/path/to/model_objaverse.ckpt
        checkpoint_hashes:
          model.pt: ad6f14067dadf85335119199b94e8249401376d5700c9b627c3608594ea99b5c
        runtime_model_revisions:
          mikaelaangel/partfield-ckpt: 90b9b1e08b6a12fdcb6ee26b4854a26235e1765f
        runtime_model_hashes:
          model_objaverse.ckpt: 463efc8a3afd3913142aa025e0125c00f16ef452b8de6a132ebe32bbe7877ee4
        source_meshes:
          cabinet_visual: /absolute/path/to/cabinet.glb
        # Explicit Particulate working-frame prior. This is not gravity alignment.
        working_axis_hint: +Z
        maximum_candidates: 4
    depends_on: [articulation_motion, artvip_retrieval, partnet_retrieval]
