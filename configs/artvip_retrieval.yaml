seed: 42
stages:
  artvip_retrieval:
    adapter:
      name: artvip_retrieval
      env: [PATH, HOME, TMPDIR]
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/articulation-env/bin/python
        worker_module: articulated_retrieval_worker
        docker_image: reconevery/articulated-retrieval:phase5c
        source_family: artvip
        index_path: /absolute/path/to/artvip/index.json
        maximum_candidates: 5
    depends_on: [articulation_motion]
