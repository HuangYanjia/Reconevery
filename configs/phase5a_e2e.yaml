seed: 42
stages:
  ingest:
    adapter:
      name: ffmpeg_ingest
      env: [PATH, HOME, TMPDIR]
      config:
        input_mode: auto
        target_fps: 3.0
        max_frames: 32
        resize_max_edge: 1600
        blur_threshold: 0.0
        duplicate_threshold: 0.0
    depends_on: []
  camera_recovery:
    adapter:
      name: colmap_camera_recovery
      env: [PATH, HOME, TMPDIR, CUDA_VISIBLE_DEVICES, LD_LIBRARY_PATH]
      config:
        execution_mode: local
        executable: /absolute/path/to/colmap-4.0.4/bin/colmap
        matcher: sequential
        camera_model: OPENCV
        single_camera: true
        use_gpu: true
        min_registered_frames: 8
        min_registration_ratio: 0.4
    depends_on: [ingest]
  segmentation_tracking:
    adapter:
      name: sam3_segmentation_tracking
      timeout_s: 14400
      env: [PATH, HOME, TMPDIR, HF_HOME, HF_TOKEN, CUDA_VISIBLE_DEVICES]
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/sam3-env/bin/python
        worker_module: sam3_worker
        prompt_manifest: configs/prompts/tabletop.yaml
        checkpoint_repository: facebook/sam3.1
        checkpoint_revision: daa63191845a41281374e725f4c9e51c7a824460
        model_mode: sam3.1
        device: cuda
        precision: bfloat16
        strategy: detect_then_track
        anchor_count: 1
        tracking_direction: forward_backward
    depends_on: [ingest, camera_recovery]
  dense_mvs:
    adapter:
      name: dense_mvs
      timeout_s: 43200
      env: [PATH, HOME, TMPDIR, CUDA_VISIBLE_DEVICES, LD_LIBRARY_PATH]
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/dense-mvs-env/bin/python
        worker_module: dense_mvs_worker
        executable: /absolute/path/to/colmap-4.0.4/bin/colmap
        use_gpu: true
        max_image_size: 1600
    depends_on: [ingest, camera_recovery]
  measured_object_geometry:
    adapter:
      name: measured_object_geometry
      timeout_s: 14400
      env: [PATH, HOME, TMPDIR, LD_LIBRARY_PATH]
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/measured-geometry-env/bin/python
        worker_module: measured_geometry_worker
    depends_on: [camera_recovery, segmentation_tracking, dense_mvs]
  phase5a_consistency_validation:
    adapter:
      name: phase5a_consistency_validation
      config: {}
    depends_on: [measured_object_geometry]
