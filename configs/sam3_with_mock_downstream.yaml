# Integration demo only: fake SAM 2D observations are followed by Phase 0.1 mock
# geometry, Scene IR assembly, validation, and export.
seed: 7
paths: {}
stages:
  ingest:
    adapter:
      name: ffmpeg_ingest
      config:
        input_mode: image_directory
        max_frames: 300
        resize_max_edge: 1920
        blur_threshold: 0.0
        duplicate_threshold: 0.0
        min_brightness: 0.0
        max_brightness: 255.0
        keep_rejected_frames: true
    depends_on: []

  camera_recovery:
    adapter:
      name: mock_camera_recovery
      config:
        source: deterministic_mock
    depends_on:
      - ingest

  segmentation_tracking:
    adapter:
      name: sam3_segmentation_tracking
      timeout_s: 30
      env:
        - PATH
        - HOME
        - TMPDIR
      config:
        execution_mode: fake_worker
        worker_python: python
        worker_script: tests/fixtures/fake_sam3_worker.py
        prompt_manifest: configs/prompts/tabletop.yaml
        device: cpu
        precision: float32
        anchor_strategy: best_quality_registered_frame
        tracking_direction: forward_backward
        min_mask_area_pixels: 8
        min_track_observations: 2
        fake_mode: success_multi
    depends_on:
      - ingest
      - camera_recovery

  global_reconstruction:
    adapter:
      name: mock_global_reconstruction
      config:
        source: mixed_integration_demo
    depends_on:
      - camera_recovery

  object_reconstruction:
    adapter:
      name: mock_object_reconstruction
      config:
        source: mixed_integration_demo
    depends_on:
      - segmentation_tracking

  scene_ir_assembly:
    adapter:
      name: mock_scene_ir_assembly
      config:
        source: mixed_integration_demo
    depends_on:
      - global_reconstruction
      - object_reconstruction

  scene_compilation:
    adapter:
      name: mock_scene_compiler
      config:
        source: mixed_integration_demo
    depends_on:
      - scene_ir_assembly

  validation:
    adapter:
      name: mock_physics_validator
      config:
        source: mixed_integration_demo
    depends_on:
      - scene_compilation

  export:
    adapter:
      name: mock_export
      config:
        source: mixed_integration_demo
    depends_on:
      - validation
