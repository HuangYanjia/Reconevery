seed: 7
stages:
  ingest:
    adapter:
      name: ffmpeg_ingest
      timeout_s: 3600
      env: [PATH, HOME, TMPDIR, LD_LIBRARY_PATH]
      config:
        input_mode: auto
        target_fps: 3.0
        max_frames: 300
        image_format: png
        resize_max_edge: 1920
        blur_threshold: 0.0
        duplicate_threshold: 0.0
        min_brightness: 5.0
        max_brightness: 250.0
        keep_rejected_frames: true
    depends_on: []
  camera_recovery:
    adapter:
      name: colmap_camera_recovery
      timeout_s: 14400
      env: [PATH, HOME, TMPDIR, LD_LIBRARY_PATH]
      config:
        execution_mode: local
        executable: colmap
        matcher: sequential
        camera_model: OPENCV
        single_camera: true
        use_gpu: false
        min_registered_frames: 8
        min_registration_ratio: 0.4
        mapper:
          multiple_models: true
        sequential_matcher:
          overlap: 10
          loop_detection: false
    depends_on: [ingest]
