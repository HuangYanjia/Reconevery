seed: 7
paths: {}
stages:
  ingest:
    adapter:
      name: ffmpeg_ingest
      timeout_s: 1800
      env:
        - PATH
        - HOME
        - TMPDIR
      config:
        input_mode: auto
        target_fps: 3.0
        max_frames: 300
        image_format: png
        resize_max_edge: 1920
        scene_change_threshold: null
        blur_threshold: 0.0
        duplicate_threshold: 0.0
        min_brightness: 5.0
        max_brightness: 250.0
        keep_rejected_frames: true
    depends_on: []

  camera_recovery:
    adapter:
      name: colmap_camera_recovery
      timeout_s: 14400
      retries: 0
      env:
        - PATH
        - HOME
        - TMPDIR
        - CUDA_VISIBLE_DEVICES
        - LD_LIBRARY_PATH
      config:
        execution_mode: local
        executable: colmap
        matcher: sequential
        camera_model: OPENCV
        single_camera: true
        use_gpu: true
        min_registered_frames: 8
        min_registration_ratio: 0.4
        mapper:
          multiple_models: true
        sequential_matcher:
          overlap: 10
          loop_detection: false
    depends_on:
      - ingest

  segmentation_tracking:
    adapter:
      name: sam3_segmentation_tracking
      timeout_s: 14400
      retries: 0
      env:
        - PATH
        - HOME
        - TMPDIR
        - HF_TOKEN
        - HF_HOME
        - HF_HUB_CACHE
        - CUDA_VISIBLE_DEVICES
        - LD_LIBRARY_PATH
      config:
        execution_mode: local_worker
        worker_python: sam3-python
        worker_module: sam3_worker
        prompt_manifest: configs/prompts/tabletop.yaml
        official_repository: https://github.com/facebookresearch/sam3
        official_code_commit: 46957e47805eaa273f4aa7bbbd25a88bca9108ce
        checkpoint_repository: facebook/sam3.1
        checkpoint_revision: daa63191845a41281374e725f4c9e51c7a824460
        model_mode: sam3.1
        device: cuda
        precision: bfloat16
        offline: false
        strategy: detect_then_track
        anchor_strategy: best_quality_registered_frame
        anchor_count: 1
        tracking_direction: forward_backward
        score_threshold: 0.5
        mask_threshold: 0.5
        min_mask_area_pixels: 32
        max_mask_area_ratio: 0.98
        min_track_observations: 2
        min_track_coverage: 0.1
        same_prompt_duplicate_iou: 0.9
    depends_on:
      - ingest
      - camera_recovery
