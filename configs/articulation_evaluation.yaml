seed: 42
stages:
  articulation_evaluation:
    adapter:
      name: articulation_evaluation
      env: [PATH, HOME, TMPDIR]
      timeout_s: 1800
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/articulation-env/bin/python
        worker_module: articulation_evaluation_worker
        docker_image: reconevery/articulation-evaluation:phase5c
        minimum_valid_states: 3
        minimum_heldout_states: 1
        minimum_usable_heldout_views: 1
        minimum_base_mask_iou: 0.45
        minimum_movable_part_mask_iou: 0.40
        minimum_whole_object_mask_iou: 0.45
        minimum_depth_inlier_fraction: 0.50
        maximum_negative_space_violation_ratio: 0.15
        maximum_front_of_scene_violation_ratio: 0.10
        maximum_base_motion_scene_diagonals: 0.02
        maximum_prismatic_orthogonal_residual: 0.05
        maximum_prismatic_rotation_degrees: 5.0
        maximum_revolute_axis_error_degrees: 15.0
        maximum_revolute_pivot_residual_part_diagonals: 0.10
    depends_on: [articulation_fitting]
