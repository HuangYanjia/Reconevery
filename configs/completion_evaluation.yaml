seed: 42
stages:
  completion_candidate_registration:
    adapter:
      name: completion_candidate_registration
      timeout_s: 7200
      env: [PATH, HOME, TMPDIR, CUDA_VISIBLE_DEVICES]
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/completion-evaluation-env/bin/python
        worker_module: completion_evaluation_worker
        maximum_surface_samples: 100000
        trimmed_fraction: 0.8
        maximum_iterations: 100
        fitting_refinement_iterations: 30
        fitting_refinement_maximum_points: 10000
        fitting_refinement_maximum_rotation_degrees: 20.0
        fitting_refinement_maximum_scale_ratio: 1.5
        fitting_refinement_translation_extent_ratio: 0.25
    depends_on: [sam3d_object_candidates, trellis2_object_candidates, measured_only_candidates]
  completion_candidate_evaluation:
    adapter:
      name: completion_candidate_evaluation
      timeout_s: 7200
      env: [PATH, HOME, TMPDIR, CUDA_VISIBLE_DEVICES]
      config:
        execution_mode: local_worker
        worker_python: /absolute/path/to/completion-evaluation-env/bin/python
        worker_module: completion_evaluation_worker
    depends_on: [completion_candidate_registration]
