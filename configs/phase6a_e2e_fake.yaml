        fake_mode: perfect_full_canonical
        minimum_heldout_tag_detections: 3
    depends_on: [calibration_evidence]
  canonical_scene_wrapper:
    adapter:
      name: canonical_scene_wrapper
      config: {}
    depends_on: [world_calibration]
  phase6a_consistency_validation:
    adapter:
      name: phase6a_consistency_validation
      config: {}
    depends_on: [canonical_scene_wrapper]
