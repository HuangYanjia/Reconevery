seed: 42
allow_existing_artifacts_for_disabled_dependencies: true
stages:
  ingest:
    enabled: false
    adapter:
      name: ffmpeg_ingest
      config:
        input_mode: auto
    depends_on: []

  camera_recovery:
    enabled: false
    adapter:
      name: colmap_camera_recovery
      config:
        execution_mode: local
        executable: colmap
    depends_on: [ingest]

  genrecon_camera_package:
    enabled: false
    adapter:
      name: genrecon_camera_package
      config: {}
    depends_on: [ingest, camera_recovery]

  global_reconstruction:
    enabled: false
    adapter:
      name: genrecon_global_reconstruction
      config:
        execution_mode: docker
        docker_image: reconevery/genrecon:phase3
    depends_on: [ingest, camera_recovery, genrecon_camera_package]

  camera_mesh_alignment:
    adapter:
      name: camera_mesh_alignment
      timeout_s: 14400
      env: [PATH, HOME, TMPDIR, CUDA_VISIBLE_DEVICES]
      config:
        execution_mode: docker
        docker_image: reconevery/alignment:phase4.2
        device: cuda
        raster_scale: 0.25
        face_chunk_size: 1000000
    depends_on:
      - camera_recovery
      - genrecon_camera_package
      - global_reconstruction
