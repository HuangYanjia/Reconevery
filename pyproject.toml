[project]
name = "recon2sim"
version = "0.1.0"
description = "Typed observation-to-simulation pipeline foundation"
requires-python = ">=3.12"
dependencies = [
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
recon2sim = "recon2sim.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12.20241230",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["recon2sim"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: optional integration tests that require external tools or hardware",
  "requires_object_lifting_gpu: requires CUDA and nvdiffrast",
]
