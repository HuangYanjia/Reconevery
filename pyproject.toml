[project]
name = "recon2sim"
version = "0.1.0"
description = "Phase 0 observation-to-simulation pipeline"
requires-python = ">=3.12"
dependencies = []
[project.scripts]
recon2sim = "recon2sim.cli:app"
[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B017", "F401", "F403", "F405"]
[tool.mypy]
python_version = "3.12"
strict = false
ignore_errors = true
warn_unused_ignores = false
[tool.pytest.ini_options]
pythonpath = ["src"]
